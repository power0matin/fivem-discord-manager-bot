name: Hardening bootstrap

on:
  push:
    branches:
      - agent/production-hardening
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-hardening

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply remaining deterministic hardening
        run: |
          if grep -q 'async function createTicketUnlocked' src/modules/tickets/index.js; then
            echo 'Second hardening patch already applied.'
          else
            node scripts/apply-hardening-2.js
          fi

      - name: Refresh lockfile and verify clean install
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run verify
          npm audit --audit-level=high

      - name: Commit generated changes
        run: |
          if git diff --quiet -- src package-lock.json; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src package-lock.json
          git commit -m 'fix: complete runtime hardening and refresh lockfile [skip ci]'
          git push origin HEAD:agent/production-hardening
