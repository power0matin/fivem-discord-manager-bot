name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  hardening-bootstrap:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/production-hardening' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply reviewed hardening patch set
        run: node scripts/apply-hardening.js

      - name: Validate patched source syntax
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test test/storage.test.js

      - name: Persist patched source to PR branch
        run: |
          if git diff --quiet -- src; then
            echo 'No source diff generated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'fix: apply production runtime hardening [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18.20.8', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Syntax
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Persistence regression tests
        run: node --test test/storage.test.js
