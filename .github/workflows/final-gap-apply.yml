name: Final gap source apply

on:
  push:
    branches:
      - agent/production-hardening
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/production-hardening
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Apply reviewed source patches
        run: |
          if grep -q '_setFsForTests' src/modules/stream-notifier/storage.js; then
            echo 'Final source patch already applied.'
          else
            node scripts/apply-final-gap-hardening.js
          fi
          node scripts/apply-storage-cleanup-hardening.js
          node scripts/apply-deploy-transaction-cleanup.js
          node scripts/apply-interrupted-install-recovery.js

      - name: Refresh lockfile for Node 22+ policy
        run: npm install --package-lock-only --ignore-scripts

      - name: Persist deterministic generated source
        run: |
          if git diff --quiet -- src scripts/install.sh scripts/restore.sh package-lock.json; then
            echo 'No generated source changes.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src scripts/install.sh scripts/restore.sh package-lock.json
            git commit -m 'fix: finalize deployment and recovery hardening [skip ci]'
            git push origin HEAD:agent/production-hardening
          fi

      - name: Clean install
        run: npm ci

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Full verification
        run: npm run verify

      - name: ShellCheck deployment scripts
        run: shellcheck scripts/*.sh scripts/lib/*.sh

      - name: Validate systemd unit
        run: systemd-analyze verify deploy/fivem-discord-manager-bot.service

      - name: Diff hygiene
        run: git diff --check
