name: Branch validation

on:
  push:
    branches:
      - agent/production-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Full verification
        run: npm run verify
      - name: Syntax check
        run: npm run check:syntax
      - name: ShellCheck
        run: shellcheck scripts/*.sh scripts/lib/*.sh
      - name: Verify systemd unit syntax
        run: systemd-analyze verify deploy/fivem-discord-manager-bot.service
      - name: Deployment and recovery focused tests
        run: >-
          node --test
          test/deployment.test.js
          test/deployment-transaction.test.js
          test/backup-restore-hardening.test.js
          test/installation-preflight.test.js
          test/systemd-unit.test.js
          test/storage-stress.test.js
          test/discord-safety.test.js
      - name: Diff and workspace hygiene
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
